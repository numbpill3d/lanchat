name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze & test
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            clang cmake ninja-build \
            libgtk-3-dev \
            libavahi-client-dev \
            libdbus-1-dev \
            pkg-config

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  build-linux:
    name: Build Linux
    needs: analyze
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            clang cmake ninja-build \
            libgtk-3-dev \
            libavahi-client-dev \
            libdbus-1-dev \
            pkg-config
      - run: flutter pub get
      - run: dart run flutter_launcher_icons
      - run: flutter build linux --release

      - name: Package tarball
        run: |
          mkdir -p "$GITHUB_WORKSPACE/dist"
          tar -czf "$GITHUB_WORKSPACE/dist/lanchat-linux-x64.tar.gz" \
            -C build/linux/x64/release/bundle .

      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/lanchat-linux-x64.tar.gz
          if-no-files-found: error

  build-android:
    name: Build Android
    needs: analyze
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
          java-version: '17'

      - name: Decode Android signing key
        if: ${{ secrets.LANCHAT_KEYSTORE_BASE64 != '' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.LANCHAT_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.LANCHAT_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.LANCHAT_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.LANCHAT_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          [ -z "$KEYSTORE_BASE64" ] || {
            mkdir -p android/app
            echo "$KEYSTORE_BASE64" | base64 -d > android/app/keystore.jks
            printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=keystore.jks\n' \
              "$KEYSTORE_PASSWORD" "$KEY_PASSWORD" "$KEY_ALIAS" \
              > android/key.properties
          }

      - run: flutter pub get
      - run: dart run flutter_launcher_icons
      - run: flutter build apk --release --split-per-abi

      - name: Verify APK signing
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          for apk in build/app/outputs/flutter-apk/*.apk; do
            if ! command -v apksigner >/dev/null; then
              echo "apksigner not available; skipping signature check for $apk"
              continue
            fi
            if ! apksigner verify --print-certs "$apk" >/dev/null 2>&1; then
              echo "::error::APK is not properly signed: $apk"
              apksigner verify --verbose "$apk" || true
              exit 1
            fi
          done

      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
